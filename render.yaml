# Render Blueprint: creates the API service. Create the Neon database separately and paste its URL.
services:
  - type: web
    name: match-insights-api
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: STORE_PROVIDER
        value: auto
      - key: DATABASE_URL        # Neon connection string, e.g. postgresql://user:pass@host/db?sslmode=require
        sync: false
      # Pipeline (narrator etc.): Gemini
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_API_KEY        # Google AI Studio key
        sync: false
      # Chat ("Ask the match"): Gemini free tier
      - key: CHAT_LLM_PROVIDER
        value: gemini
      - key: CHAT_LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: CHAT_LLM_API_KEY   # Google AI Studio API key
        sync: false
      - key: WARM_ON_START
        value: "false"
      - key: CORS_ORIGINS        # your Vercel production URL, e.g. https://match-insights.vercel.app
        sync: false
